<!doctype html>
<html lang="de" data-theme="hunt" data-font="western">
<head>
<meta charset="utf-8">
<title>HuntXtract</title>
<script>
  // The design chosen last time, before anything is drawn (the settings arrive a moment later).
  (function () {
    try {
      var look = JSON.parse(localStorage.getItem('kopfgeld.look') || 'null');
      if (!look) return;
      var root = document.documentElement, ok = /^[a-z0-9-]+$/, color = /^#[0-9a-f]{6}$/i;
      if (ok.test(look.theme)) root.setAttribute('data-theme', look.theme);
      if (ok.test(look.font)) root.setAttribute('data-font', look.font);
      if (color.test(look.accent)) root.style.setProperty('--gold', look.accent);
      if (color.test(look.onAccent)) root.style.setProperty('--on-accent', look.onAccent);
      if (ok.test(look.image)) root.style.setProperty('--bg-image', 'url("/img/' + look.image + '.jpg")');
      root.style.setProperty('--bg-strength', String(Number(look.strength) || 0));
    } catch (e) { /* first start: the default design */ }
  })();
</script>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/overlay/overlay.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="/img/logo-mark.png" alt="" aria-hidden="true">
      <div>
        <div class="brand-name">Hunt<span class="brand-x">X</span>tract</div>
        <a class="brand-sub" id="brandAuthor" href="https://steamcommunity.com/id/blizzi1337/" title="Steam-Profil von Chris aka BliZzi1337 öffnen"
          data-i18n-title="Steam-Profil von Chris aka BliZzi1337 öffnen">by Chris aka BliZzi1337</a>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-view="dashboard"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 7h6V4h-6z"/></svg><span data-i18n="Übersicht">Übersicht</span></button>
      <button data-view="matches"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Matches</span></button>
      <button data-view="setup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span data-i18n="Einrichtung">Einrichtung</span></button>
      <button data-view="overlay"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M7 21h10M6 13h5"/></svg><span>Overlay</span></button>
      <button data-view="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span data-i18n="Einstellungen">Einstellungen</span></button>
    </nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h1 id="viewTitle"></h1>
      <div class="pills">
        <div class="pill" id="pillObs"><span class="dot"></span><span class="pill-text"></span></div>
        <div class="pill" id="pillDetect"><span class="dot"></span><span class="pill-text"></span></div>
        <div class="pill" id="pillHunt" hidden><span class="dot"></span><span class="pill-text"></span></div>
      </div>
      <button class="btn primary" id="btnExtract" title="Liest den aktuellen Bildschirm sofort aus – die Mission Summary oder, wenn sie zu sehen ist, die Team Details"
        data-i18n-title="Liest den aktuellen Bildschirm sofort aus – die Mission Summary oder, wenn sie zu sehen ist, die Team Details">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
        <span data-i18n="Jetzt auslesen">Jetzt auslesen</span>
      </button>
    </header>
    <div class="livebar" id="liveBar" hidden>
      <div class="livebar-text"><b id="liveTitle"></b><span id="liveDetail"></span></div>
      <div class="livebar-count" id="liveCount"><b></b><span data-i18n="bis zum Auslesen">bis zum Auslesen</span></div>
      <div class="livebar-progress"><span id="liveProgress"></span></div>
    </div>
    <section class="view" id="view"></section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<div class="modal-backdrop" id="modal" hidden></div>
<div class="tour" id="tour" hidden></div>
<script src="/overlay/overlay.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
